<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#102c3b" />
    <meta name="description" content="在地图上记录去过和计划前往的中国城市，支持多模型 AI 智能规划、周游账号三端云同步、好友足迹对比与行程群共编聊天。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="周游地图" />
    <meta property="og:title" content="周游地图 · 中国旅行足迹地图、同行旅伴、手账与 AI 行程规划" />
    <meta property="og:description" content="点亮去过的中国城市，记录照片手账与每日预算，内置多模型 AI 智能规划、账号三端云同步、好友足迹对比与行程群共编聊天。" />
    <meta property="og:url" content="https://zhouyou.online/" />
    <meta property="og:image" content="https://zhouyou.online/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="周游地图" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>周游地图</title>
    <script>
      // 首帧前应用已保存的主题，避免深色模式下先闪白。
      try { var t = localStorage.getItem('travel-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
      // 风格同样在首帧前恢复，未设置时默认使用复古手账风，旧版 peach 平滑迁移。
      try {
        var a = localStorage.getItem('travel-appearance');
        if (a === 'peach') a = 'candy';
        document.documentElement.dataset.appearance = ['candy', 'white', 'journal', 'coast', 'warm'].includes(a) ? a : 'journal';
      } catch (e) {
        document.documentElement.dataset.appearance = 'journal';
      }
      // 字号在首帧前恢复，避免页面加载时字号跳动。
      try {
        var fs = localStorage.getItem('travel-font-scale');
        document.documentElement.dataset.fontScale = (fs === 'compact' || fs === 'standard' || fs === 'large') ? fs : 'standard';
      } catch (e) {
        document.documentElement.dataset.fontScale = 'standard';
      }
      // 语言也在首帧前恢复，避免标题和语言属性闪烁。
      try {
        var l = localStorage.getItem('travel-lang') === 'en' ? 'en' : 'zh';
        document.documentElement.dataset.lang = l;
        document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
        document.title = l === 'en' ? 'Zhouyou Map' : '周游地图';
      } catch (e) {
        document.documentElement.dataset.lang = 'zh';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
