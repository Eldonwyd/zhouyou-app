name: Release Mobile App (Android / iOS)

on:
  push:
    tags:
      - 'mobile-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '手机版版本号（例如 1.0.0，留空则读取 package.json）'
        required: false
        default: ''
      prerelease:
        description: '标记为 Pre-release 预览版'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Mobile Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/mobile-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#mobile-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
            VER="${VER#mobile-v}"
            VER="${VER#v}"
            TAG="mobile-v${VER}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="mobile-v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Mobile · Android (APK)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify preinstalled Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "${SDK_DIR}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [[ -n "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          fi
          ls -la "${SDK_DIR}/build-tools"
      - run: npm ci
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: |
          npm run build
          npx cap add android
          node scripts/prepare-mobile.mjs android
          npx cap sync android
      - name: Assemble & sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="dist-artifacts/Zhouyou-Map-${{ needs.prepare.outputs.version }}-android.apk"
          mkdir -p dist-artifacts

          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)
          "${BUILD_TOOLS_DIR}/zipalign" -v -p 4 "${UNSIGNED_APK}" aligned.apk

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Using permanent release keystore from GitHub Secrets (alias: ${ANDROID_KEY_ALIAS})"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 -d > release.keystore
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            KEY_PASS="${ANDROID_KEY_PASSWORD}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured; falling back to an ephemeral keystore!"
            KS_PASS="zhouyou-release-key"
            KEY_ALIAS="zhouyou"
            KEY_PASS="zhouyou-release-key"
            keytool -genkeypair -v -keystore release.keystore -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KS_PASS}" -keypass "${KEY_PASS}" \
              -dname "CN=Zhouyou Map, OU=OpenSource, O=Zhouyou, L=China, ST=China, C=CN"
          fi

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "${SIGNED_APK}" \
            aligned.apk

          "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${SIGNED_APK}"
          rm -f dist-artifacts/*.idsig
          node scripts/build-hot-update.mjs --mobile-only --out-dir=dist-artifacts
          ls -lh dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: dist-artifacts/*

  build-ios:
    name: Mobile · iOS (Unsigned IPA)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: |
          npm run build
          npx cap add ios
          node scripts/prepare-mobile.mjs ios
          npx cap sync ios
      - name: Build unsigned iOS IPA
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts ios-build
          if [[ -d "ios/App/App.xcworkspace" ]]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios-build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              build
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios-build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              build
          fi
          APP_PATH=$(find ios-build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p ipa-stage/Payload
          cp -R "${APP_PATH}" ipa-stage/Payload/
          (cd ipa-stage && zip -qry "../dist-artifacts/Zhouyou-Map-${{ needs.prepare.outputs.version }}-ios-unsigned.ipa" Payload)
          ls -lh dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: dist-artifacts/*

  publish-mobile-release:
    name: Publish Mobile GitHub Release
    needs: [prepare, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt
      - run: node scripts/generate-release-notes.mjs "${{ needs.prepare.outputs.version }}" release-files release-notes.md mobile
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "📱 手机移动版 · Mobile v${{ needs.prepare.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease || false }}
          files: release-files/*
