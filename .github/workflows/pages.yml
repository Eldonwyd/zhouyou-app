name: Deploy Web & Download Center to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published, edited, released]
  workflow_run:
    workflows:
      - "Release Mobile App (Android / iOS)"
      - "Release Desktop App (Windows / macOS / Linux)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static web / PWA app
        run: npm run build

      - name: Copy README preview screenshots & GIFs for reliable CDN loading
        run: |
          mkdir -p dist/screenshots
          cp docs/screenshots/*.png docs/screenshots/*.gif dist/screenshots/

      - name: Generate static releases.json for download center
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("node:fs");
            const extractVersion = (tag) => {
              const cleaned = String(tag || "").trim().replace(/^(?:desktop|mobile)-v?/i, "").replace(/^v/i, "");
              const match = cleaned.match(/(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)/);
              return match ? match[1] : cleaned;
            };
            const compareSemver = (a, b) => {
              const parse = (raw) => {
                const clean = extractVersion(raw);
                const [core, pre = ""] = clean.split("-", 2);
                const parts = core.split(".").map((n) => Number.parseInt(n, 10) || 0);
                return { major: parts[0] || 0, minor: parts[1] || 0, patch: parts[2] || 0, pre };
              };
              const va = parse(a);
              const vb = parse(b);
              if (va.major !== vb.major) return va.major > vb.major ? 1 : -1;
              if (va.minor !== vb.minor) return va.minor > vb.minor ? 1 : -1;
              if (va.patch !== vb.patch) return va.patch > vb.patch ? 1 : -1;
              if (va.pre === vb.pre) return 0;
              if (!va.pre && vb.pre) return 1;
              if (va.pre && !vb.pre) return -1;
              return va.pre.localeCompare(vb.pre);
            };
            const sliceCodePoints = (text, max) => {
              const chars = Array.from(String(text || ""));
              return chars.length <= max ? chars.join("") : chars.slice(0, max).join("");
            };
            const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`;
            const headers = { Accept: "application/vnd.github+json", "User-Agent": "zhouyou-pages-build" };
            if (process.env.GH_TOKEN) headers.Authorization = `Bearer ${process.env.GH_TOKEN}`;
            fetch(url, { headers })
              .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
              .then((list) => {
                const slim = (Array.isArray(list) ? list : [])
                  .filter((r) => !r.draft)
                  .sort((a, b) => {
                    const diff = compareSemver(b.tag_name, a.tag_name);
                    if (diff !== 0) return diff;
                    return Date.parse(b.published_at || "0") - Date.parse(a.published_at || "0");
                  })
                  .map((r) => ({
                    tag_name: r.tag_name,
                    name: r.name,
                    body: sliceCodePoints(r.body || "", 1200),
                    draft: Boolean(r.draft),
                    prerelease: Boolean(r.prerelease),
                    html_url: r.html_url,
                    published_at: r.published_at,
                    assets: (r.assets || []).map((a) => ({
                      name: a.name,
                      size: a.size,
                      browser_download_url: a.browser_download_url,
                    })),
                  }));
                fs.writeFileSync("dist/releases.json", JSON.stringify(slim, null, 2));
                console.log(`Wrote dist/releases.json (${slim.length} releases)`);
              })
              .catch((err) => {
                console.warn("Could not fetch releases.json:", err.message);
                fs.writeFileSync("dist/releases.json", "[]");
              });
          '

      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload dist artifact for Cloudflare Pages
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (zhouyou.online)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (for functions/)
        uses: actions/checkout@v4

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist

      - name: Deploy dist + functions to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'zhouyou-app' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured yet; skipping Cloudflare Pages deploy."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-dirty=true
