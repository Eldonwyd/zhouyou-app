name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Validate Maps & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run check

      - name: Validate geographic boundary maps
        run: npm run test:maps

      - name: Build production web bundle
        run: npm run build

      - name: Bundle embedded Electron server
        run: npm run build:electron-server
