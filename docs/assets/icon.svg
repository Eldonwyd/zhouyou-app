<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="52%" stop-color="#F26B5B"/>
      <stop offset="100%" stop-color="#1E5F74"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F6EDE1"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF785A"/>
      <stop offset="100%" stop-color="#E04F45"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8A9E"/>
      <stop offset="100%" stop-color="#164B60"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#102C3B" flood-opacity="0.24"/>
    </filter>
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#8C261F" flood-opacity="0.28"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="44" y="44" width="936" height="936" rx="224"/>
    </clipPath>
  </defs>

  <!-- Rounded App Icon Background -->
  <g clip-path="url(#iconClip)">
    <rect x="44" y="44" width="936" height="936" rx="224" fill="url(#bg)"/>
    <!-- Subtle sunlit ambient glow -->
    <circle cx="260" cy="230" r="240" fill="#FFE0B2" opacity="0.22"/>
    <circle cx="800" cy="820" r="260" fill="#0E3847" opacity="0.22"/>
  </g>

  <!-- Folded Paper Map Card -->
  <g filter="url(#shadow)">
    <path d="M 188 308 L 404 236 L 620 296 L 836 228 L 836 734 L 620 802 L 404 742 L 188 814 Z"
          fill="url(#card)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <!-- Center fold shading -->
    <path d="M 404 236 L 620 296 L 620 802 L 404 742 Z" fill="#EFE2D0" opacity="0.55"/>
    <!-- Decorative terrain / coastline shapes -->
    <path d="M 218 590 Q 305 510 388 555 T 595 520 Q 705 470 806 540 L 806 710 L 620 770 L 404 712 L 218 776 Z"
          fill="url(#sea)" opacity="0.16"/>
    <!-- Dashed travel trail across the map -->
    <path d="M 272 678 C 330 572, 412 630, 490 546 C 562 468, 636 565, 738 430"
          fill="none" stroke="#1E5F74" stroke-width="20" stroke-linecap="round" stroke-dasharray="28 32" opacity="0.72"/>
    <!-- Origin dot -->
    <circle cx="272" cy="678" r="24" fill="#1E5F74"/>
    <circle cx="272" cy="678" r="10" fill="#FFFDF8"/>
    <!-- Destination star -->
    <path d="M 738 386 L 750 418 L 782 430 L 750 442 L 738 474 L 726 442 L 694 430 L 726 418 Z"
          fill="#F4A236"/>
  </g>

  <!-- Prominent Location Pin with Compass Star -->
  <g filter="url(#pinShadow)">
    <path d="M 512 154 C 398 154, 312 240, 312 350 C 312 490, 488 626, 502 636 C 508 640, 516 640, 522 636 C 536 626, 712 490, 712 350 C 712 240, 626 154, 512 154 Z"
          fill="url(#pin)" stroke="#FFFDF8" stroke-width="18" stroke-linejoin="round"/>
    <!-- Inner circle -->
    <circle cx="512" cy="350" r="104" fill="#FFFDF8"/>
    <!-- 4-point Compass Star -->
    <path d="M 512 266 L 534 328 L 596 350 L 534 372 L 512 434 L 490 372 L 428 350 L 490 328 Z"
          fill="#1E5F74"/>
    <circle cx="512" cy="350" r="18" fill="#FF785A"/>
  </g>
</svg>
